# Single-package repo; this file only holds pnpm settings
# uni-app's compiler relies on undeclared transitive dependencies, so node_modules must be hoisted flat
shamefullyHoist: true
allowBuilds:
  '@swc/core': true
  core-js: false
  core-js-pure: false
  esbuild: true
  less: false
  protobufjs: false
  vue-demi: true
